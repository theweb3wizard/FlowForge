<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#1F1F1F" stroke-width="1"/>

  <!-- Left glow blob -->
  <ellipse cx="100" cy="315" rx="280" ry="200" fill="#FAFAFA" opacity="0.025"/>

  <!-- Logo mark (top-left) -->
  <rect x="72" y="64" width="48" height="48" rx="11" fill="#111111" stroke="#1F1F1F" stroke-width="1.5"/>
  <!-- F letterform in logo -->
  <rect x="83" y="75" width="18" height="4" rx="2" fill="#FAFAFA"/>
  <rect x="83" y="75" width="4" height="22" rx="2" fill="#FAFAFA"/>
  <rect x="83" y="85" width="13" height="4" rx="2" fill="#FAFAFA"/>
  <!-- Node dot -->
  <circle cx="106" cy="93" r="4" fill="#FAFAFA" opacity="0.85"/>
  <line x1="87" y1="93" x2="101" y2="93" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Brand name -->
  <text x="136" y="97" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#737373">Flow</text>
  <text x="196" y="97" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#FAFAFA">Forge</text>

  <!-- Main headline -->
  <text x="72" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Build deployment</text>
  <text x="72" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="#FAFAFA">workflows.</text>

  <!-- Sub-headline -->
  <text x="72" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#737373" letter-spacing="-0.3">Define once. Run on any EVM chain. Share with your team.</text>

  <!-- Three trust badges -->
  <!-- Badge 1 -->
  <rect x="72" y="440" width="168" height="38" rx="8" fill="#111111" stroke="#1F1F1F" stroke-width="1.5"/>
  <text x="92" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FAFAFA">⛓  9 EVM Chains</text>

  <!-- Badge 2 -->
  <rect x="256" y="440" width="192" height="38" rx="8" fill="#111111" stroke="#1F1F1F" stroke-width="1.5"/>
  <text x="276" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FAFAFA">⚡  Variable Passing</text>

  <!-- Badge 3 -->
  <rect x="464" y="440" width="178" height="38" rx="8" fill="#111111" stroke="#1F1F1F" stroke-width="1.5"/>
  <text x="484" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#FAFAFA">🔗  No Local Setup</text>

  <!-- Right panel: mock recipe steps UI -->
  <rect x="720" y="80" width="420" height="470" rx="16" fill="#111111" stroke="#1F1F1F" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="720" y="80" width="420" height="52" rx="16" fill="#111111"/>
  <rect x="720" y="118" width="420" height="14" fill="#111111"/>
  <text x="744" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#737373" letter-spacing="0.5">RECIPE · Token + Staking System</text>
  <line x1="720" y1="132" x2="1140" y2="132" stroke="#1F1F1F" stroke-width="1"/>

  <!-- Step 1 — Success -->
  <rect x="744" y="152" width="372" height="72" rx="10" fill="#0A0A0A" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="772" cy="188" r="10" fill="#22C55E" fill-opacity="0.15"/>
  <text x="768" y="193" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#22C55E" font-weight="700">✓</text>
  <text x="792" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#FAFAFA" font-weight="600">Deploy ERC-20 Token</text>
  <rect x="792" y="190" width="46" height="16" rx="4" fill="#1F3A2A"/>
  <text x="800" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#22C55E">DEPLOY</text>
  <text x="856" y="202" font-family="monospace,Courier New,monospace" font-size="10" fill="#737373">0x4a2f...c3e1</text>

  <!-- Step 2 — Success -->
  <rect x="744" y="238" width="372" height="72" rx="10" fill="#0A0A0A" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="772" cy="274" r="10" fill="#22C55E" fill-opacity="0.15"/>
  <text x="768" y="279" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#22C55E" font-weight="700">✓</text>
  <text x="792" y="269" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#FAFAFA" font-weight="600">Deploy Staking Contract</text>
  <rect x="792" y="276" width="46" height="16" rx="4" fill="#1F3A2A"/>
  <text x="800" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#22C55E">DEPLOY</text>
  <text x="856" y="288" font-family="monospace,Courier New,monospace" font-size="10" fill="#737373">uses step 1 address</text>

  <!-- Step 3 — Running -->
  <rect x="744" y="324" width="372" height="72" rx="10" fill="#0A0A0A" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="772" cy="360" r="8" fill="#F59E0B" fill-opacity="0.2"/>
  <circle cx="772" cy="360" r="4" fill="#F59E0B"/>
  <text x="792" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#FAFAFA" font-weight="600">Grant Minter Role</text>
  <rect x="792" y="362" width="56" height="16" rx="4" fill="#2D2000"/>
  <text x="798" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#F59E0B">INTERACT</text>
  <text x="860" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#F59E0B" opacity="0.7">Confirming…</text>

  <!-- Step 4 — Pending -->
  <rect x="744" y="410" width="372" height="72" rx="10" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="1.5"/>
  <circle cx="772" cy="446" r="8" fill="#1F1F1F"/>
  <circle cx="772" cy="446" r="3" fill="#737373"/>
  <text x="792" y="441" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#737373" font-weight="600">Transfer Ownership</text>
  <rect x="792" y="448" width="56" height="16" rx="4" fill="#1A1A1A"/>
  <text x="798" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#737373">INTERACT</text>

  <!-- Bottom domain tag -->
  <text x="72" y="574" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#737373">flowforge.app</text>

  <!-- OZ Defender callout pill (top-right) -->
  <rect x="888" y="510" width="224" height="36" rx="8" fill="#1A1000" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
  <text x="908" y="533" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#F59E0B">⚠  OZ Defender alternative</text>
</svg>
